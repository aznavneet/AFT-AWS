stages:
  - validate
  - plan
  - apply

variables:
  TF_ROOT: terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: "eu-north-1"
  AWS_REGION: "eu-north-1"
  AWS_DEFAULT_REGION: "eu-north-1"
  TF_VAR_aws_role_arn: "$AWS_ROLE_ARN"

image:
  name: hashicorp/terraform:1.6.6
  entrypoint: [""]

before_script:
  - apk add --no-cache bash curl jq python3 py3-pip aws-cli

  # Verify base credentials
  - aws sts get-caller-identity

  # Assume deployment role
  - |
      CREDS=$(aws sts assume-role \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name gitlab-aft)

      export AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')
      export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')
      export AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')

  # Verify assumed role
  - aws sts get-caller-identity

  - cd $TF_ROOT

validate:
  stage: validate
  script:
    - terraform fmt -recursive
    - terraform init
    - terraform validate
  only:
    - feature/aft-deployment

plan:
  stage: plan
  script:
    - terraform init
    - echo "===== AFT MODULE PROVIDERS ====="
    - cat .terraform/modules/aft/providers.tf
    - echo "===== END ====="
    - terraform plan -lock=false -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
  only:
    - feature/aft-deployment

