image:
  name: hashicorp/terraform:1.6.6
  entrypoint:
    - ""

stages:
  - validate
  - plan
  - apply

variables:
  TF_ROOT: "terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

  TF_VAR_aws_region: $AWS_REGION
  TF_VAR_aws_role_arn: $AWS_ROLE_ARN

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/aft-deployment"'
    - when: never

before_script:
  - apk add --no-cache bash curl jq
  - cd $TF_ROOT
  - terraform --version

validate:
  stage: validate
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate

plan:
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 7 days

apply:
  stage: apply
  dependencies:
    - plan
  script:
    - terraform apply -auto-approve tfplan
  when: manual